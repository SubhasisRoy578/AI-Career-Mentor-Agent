services:
  - type: web
    name: ai-career-mentor-backend
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AI_API_KEY
        sync: false
